<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
{%- include head.html -%}
<body>

    {%- include header.html -%}

    <main>
        {%- if page.title -%}
            <h1>{{ page.title }}</h1>
        {%- endif -%}
        {%- if page.date -%}
            <div class="post-meta">
                <span class="post-date">{{ page.date | date: "%Y-%m-%d" }}</span>
                {%- for tag in page.tags -%}
                    <span class="post-tag">{{ tag | escape }}</span>
                {%- endfor -%}
            </div>
        {%- endif -%}

        {{ content }}
    </main>

    {%- include footer.html -%}

</body>
</html>
